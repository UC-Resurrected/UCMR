# The Linux build (docs/WINDOWS-DEPENDENCIES.md §7.4 and §13): what already builds and runs on Linux, from the same
# sources as the Windows build. It grows phase by phase. Its own workflow, so it never holds up the Windows build or
# its release (both stay in build-windows.yml); a red job here shows which part of the port broke, and the first
# compiler errors appear as annotations of the run.
name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']   # a release: the Linux package is added to the release the Windows build makes (linux-package)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The launcher core (launcher/native/build.sh): libuncharted_native.so and game_starter. Features whose Linux body
  # comes in a later phase answer "not on Linux yet" (§4.1).
  launcher-core:
    name: Launcher core (libuncharted_native.so)
    runs-on: ubuntu-22.04   # glibc 2.35: the oldest system the Linux package is meant for
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-15 libvulkan-dev libcurl4-openssl-dev zlib1g-dev

      - name: Build
        run: |
          if ! CXX=clang++-15 bash launcher/native/build.sh > build.log 2>&1; then
            cat build.log
            grep -E "error|undefined reference" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cat build.log

      - name: Check the library
        run: |
          echo "exported functions: $(nm -D --defined-only launcher/native/libuncharted_native.so | grep -c ' T un_')"
          echo "libraries it needs:"; objdump -p launcher/native/libuncharted_native.so | grep NEEDED
          clang++-15 -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -Ilauncher/native launcher/native/core_smoke.cpp \
            -o core_smoke -ldl
          ./core_smoke launcher/native/libuncharted_native.so . | tee smoke.log
          grep FAIL smoke.log | while IFS= read -r l; do echo "::error::core_smoke: $l"; done
          ! grep -q FAIL smoke.log

      - name: Check the process layer
        run: |
          # port.h's Linux process functions (start, pipes, folder, environment, time-outs, process list, kill_tree)
          clang++-15 -std=c++17 -O2 -Wall -Wextra -Ilauncher/native launcher/native/port_smoke.cpp -o port_smoke
          ./port_smoke | tee port.log
          grep FAIL port.log | while IFS= read -r l; do echo "::error::port_smoke: $l"; done
          ! grep -q FAIL port.log

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: launcher-core-linux
          path: |
            launcher/native/libuncharted_native.so
            launcher/native/game_starter
            launcher/native/apply_update

  # The importers (u2import, u3import, u3fix: tools/build_importers_linux.sh, the same sources as
  # tools/package_windows.sh) and the package's build tools. tools/importer_smoke.sh runs the importers' checks that
  # need no game files (usage, code ids, the recipe's step list and fingerprint).
  importers:
    name: Importer core and build tools
    runs-on: ubuntu-24.04   # clang 18: the importers use C++20 that clang 15 and libstdc++ 12 reject
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang zlib1g-dev unzip

      - name: Build the importers
        run: CXX=clang++ bash tools/build_importers_linux.sh

      - name: Importer checks (no game files)
        run: bash tools/importer_smoke.sh

      - name: mkzip and code_ids
        run: |
          for t in "mkzip -std=c++17 tools/mkzip.cpp -lz" "code_ids -std=c++20 tools/code_ids.cpp"; do
            set -- $t
            if ! clang++ -O2 -Wall -Wextra "$2" -o "out/$1" "$3" ${4:-} 2> "out/$1.log"; then
              cat "out/$1.log"; echo "::error title=$3::$(grep -m4 'error' "out/$1.log" | tr '\n' ' ')"; exit 1
            fi
          done
          # a zip of the launcher core's sources, read back by unzip
          out/mkzip out/test.zip launcher/native
          unzip -tq out/test.zip

  # The Linux package (tools/package_linux.sh, §7.5): UCMR_linux.tar.gz with the Windows zip's layout, from every
  # push and pull request, built on Ubuntu 22.04 (glibc 2.35, the oldest system it is meant for) with a newer clang
  # from apt.llvm.org (the importers' C++20) and Qt from download.qt.io (aqtinstall; 22.04's own Qt 6.2 is too old).
  # With the private package files (as the Windows build: the helper's link, and the online programs, built here from
  # their source) it is the player package; without them (a pull request from a fork) a test package without the helper.
  # A pushed tag vX.Y.Z adds it to that release (§13 phase 7). The check unpacks it, hides the Qt it was built with,
  # starts the launcher without a screen until its core is ready, asks the online program for its hello and runs the
  # importers' checks on the unpacked folder. The game runtime comes from the runtime job (gpu-tests, Ubuntu 24.04).
  linux-package:
    name: Linux package
    needs: gpu-tests   # the game runtime is built there (C++23 toolchain) and staged into this package
    runs-on: ubuntu-22.04
    # a release also waits for the Windows build's release (up to its 150 minutes)
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 240 || 60 }}
    permissions:
      contents: write   # adding the package to a tag's release
    env:
      QT_VERSION: 6.8.3
      LLVM_VERSION: 18
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-$LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          # the compiler, the FFmpeg build (nasm, zlib), the launcher core (curl, Vulkan headers), Qt's build needs
          # (GL, xkbcommon) and the libraries Qt's X11/Wayland plugins load (the package takes the less common ones)
          sudo apt-get install -y -q --no-install-recommends "clang-$LLVM_VERSION" ninja-build nasm zlib1g-dev \
            libcurl4-openssl-dev libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-shm0 \
            libxcb-glx0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libdbus-1-3
          "clang++-$LLVM_VERSION" --version | head -1

      - name: Reuse Qt
        id: qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VERSION }}-ubuntu-22.04

      - name: Qt
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          # aqtinstall (CI glue only) downloads the official Qt build from download.qt.io
          python3 -m pip install -q aqtinstall
          arch=$(python3 -m aqt list-qt linux desktop --arch "$QT_VERSION" | tr ' ' '\n' | grep -m1 'gcc_64')
          python3 -m aqt install-qt -O "$HOME/Qt" linux desktop "$QT_VERSION" "$arch"
          ls "$HOME/Qt/$QT_VERSION"

      - name: Reuse the small FFmpeg
        uses: actions/cache@v4
        with:
          path: downloads/ffmpeg-8.1.1-min-linux
          key: ffmpeg-min-linux-${{ hashFiles('tools/build_ffmpeg.sh') }}-ubuntu-22.04

      - name: Small FFmpeg
        run: CC=gcc bash tools/build_ffmpeg.sh

      - name: The runtime (from the runtime job)
        uses: actions/download-artifact@v4
        with:
          name: runtime-linux
          path: dist/runtime

      # The private package files (another repository, the Windows build's two secrets): a release needs them, other
      # builds go on without them. The online programs are built from its source on this system (so they run where the
      # launcher runs); then its apply program (apply.cpp, Linux build) puts its Linux files in. Nothing of that source
      # may reach this public log: the builds print nothing.
      - name: Private package files
        env:
          EXTRA_REPO: ${{ vars.PACKAGE_EXTRA_REPO || secrets.PACKAGE_EXTRA_REPO }}
          EXTRA_TOKEN: ${{ secrets.PACKAGE_EXTRA_TOKEN }}
        run: |
          if [[ -z $EXTRA_REPO || -z $EXTRA_TOKEN ]]; then
            [[ $IS_RELEASE == true ]] && { echo "::error::the private package files are not set up"; exit 1; }
            echo "no private package files: building without them"
            echo "PACKAGE_WITHOUT_HELPER=1" >> "$GITHUB_ENV"   # tools/package_linux.sh: a test package without the helper
            exit 0
          fi
          files=$RUNNER_TEMP/private-files
          git clone -q --depth 1 "https://x-access-token:${EXTRA_TOKEN}@github.com/${EXTRA_REPO}.git" "$files" > /dev/null 2>&1 ||
            { echo "::error::the private package files could not be fetched"; exit 1; }
          CC="clang-$LLVM_VERSION" CXX="clang++-$LLVM_VERSION" bash "$files/online-source/build.sh" > /dev/null 2>&1 ||
            { echo "::error::the online programs did not build"; exit 1; }
          install -m 755 "$files/online-source/build/uncharted_online" "$files/online-source/build/u2_online" \
            "$files/launcher-files/u3mp/patcher/online/"
          "clang++-$LLVM_VERSION" -std=c++20 -O2 "$files/apply.cpp" -o "$files/apply" > /dev/null 2>&1 ||
            { echo "::error::the private package files' apply program did not build"; exit 1; }
          APPLY_FILES="$files" "$files/apply" "$GITHUB_WORKSPACE"
          rm -rf "$files"

      - name: Package
        run: |
          export QT_DIR=$(ls -d "$HOME/Qt/$QT_VERSION"/*gcc_64 | head -1)
          CXX="clang++-$LLVM_VERSION" bash tools/package_linux.sh

      - name: Contents
        run: |
          tar -tzvf dist/UCMR_linux.tar.gz | awk '{s += $3} END {printf "%d files, %.1f MB unpacked\n", NR, s / 1048576}'
          (cd dist/UCMR_linux && find . -maxdepth 3 -not -path './u3mp/patcher/*' | sort)

      - name: Check the package
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf dist/UCMR_linux.tar.gz
          pkg=$RUNNER_TEMP/unpacked/UCMR_linux
          mv "$HOME/Qt" "$HOME/Qt.hidden"   # only the package's own Qt may be found
          trap 'mv "$HOME/Qt.hidden" "$HOME/Qt"' EXIT
          missing=$(find "$pkg/launcher-qt" -name '*.so*' -o -name UCMRLauncher | xargs ldd 2>/dev/null | grep 'not found' | sort -u || true)
          if [[ -n $missing ]]; then echo "$missing"; echo "::error title=package::libraries not found: $missing"; exit 1; fi
          echo "every library of the launcher window is found"
          if ! QT_QPA_PLATFORM=offscreen timeout 120 "$pkg/UCMR_Launcher" --self-check > selfcheck.log 2>&1; then
            cat selfcheck.log; echo "::error title=launcher self-check::$(tail -n 4 selfcheck.log | tr '\n' ' ')"; exit 1
          fi
          cat selfcheck.log
          grep -q 'self-check: window and launcher core ready' selfcheck.log
          # the launcher update's installer, which an update of this package needs (updater.cpp REQUIRED)
          "$pkg/tools/apply_update" --help | grep -q '^usage: apply_update' ||
            { echo "::error title=package::tools/apply_update is missing or does not start"; exit 1; }
          # the online programs (private files): only the Linux ones, their libraries found, the account client's hello
          if [[ ${PACKAGE_WITHOUT_HELPER:-} != 1 ]]; then
            online=$pkg/u3mp/patcher/online
            if ls "$online"/*.exe > /dev/null 2>&1; then echo "::error title=package::Windows online programs in the Linux package"; exit 1; fi
            missing=$(ldd "$online/uncharted_online" "$online/u2_online" 2>&1 | grep 'not found\|not a dynamic' || true)
            if [[ -n $missing ]]; then echo "::error title=package::online programs: $missing"; exit 1; fi
            reply=$(echo '{"op":"hello"}' | timeout 30 "$online/uncharted_online" || true)
            grep -q '"abi"' <<< "$reply" || { echo "::error title=package::the online program does not answer"; exit 1; }
            echo "online programs: libraries found, the account client answers"
          fi
          OUT=$pkg bash tools/importer_smoke.sh
          # the game runtime (built on Ubuntu 24.04 by the runtime job): its libraries, and a start without a game where
          # this system's C library is new enough for it
          probe=$pkg/gow3_pc/out/gow3-probe
          ldd "$probe" > runtime-ldd.log 2>&1 || true
          cat runtime-ldd.log
          if grep -q 'version .GLIBC_[0-9.]*. not found' runtime-ldd.log; then
            echo "::warning title=runtime::gow3-probe needs a newer C library than Ubuntu 22.04's: $(grep -o 'GLIBC_[0-9.]*' runtime-ldd.log | sort -uV | tail -1)"
          else
            missing=$(grep 'not found' runtime-ldd.log || true)
            if [[ -n $missing ]]; then echo "::error title=runtime::libraries not found: $missing"; exit 1; fi
            status=0; "$probe" > usage.log 2>&1 || status=$?
            cat usage.log
            [[ $status == 1 ]] && grep -q '^Usage: ' usage.log
          fi

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: UCMR_linux
          path: dist/UCMR_linux.tar.gz
          compression-level: 0   # already compressed

      # A release: the Windows build makes it (build-windows.yml, with the tag's notes); this adds the Linux package
      # once it is there. GitHub records the file's SHA-256, which the launcher's update checks before installing.
      - name: Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '[:space:]' < tools/VERSION)
          [[ $TAG == "v$version" ]] || { echo "::error::the tag $TAG is not tools/VERSION ($version)"; exit 1; }
          for i in $(seq 1 170); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 60
          done
          gh release view "$TAG" > /dev/null 2>&1 || { echo "::error::no release $TAG (did the Windows build fail?)"; exit 1; }
          gh release upload "$TAG" dist/UCMR_linux.tar.gz

  # The game runtime (gow3_pc/build.sh: gow3-probe with the GPU library and every C++ subsystem, the same CMake
  # target as Windows) and the unit tests that need no game (gow3_pc/tests/run_unit_tests.sh), with lavapipe as a
  # software Vulkan device. Ubuntu 24.04 for a C++23 compiler and library; SDL3 is built from source (no distro
  # package yet) with the X11, Wayland and sound parts it loads at run time; the runtime links the small FFmpeg
  # (tools/build_ffmpeg.sh). No game files exist here: gow3-probe is built, linked and started (usage, the Vulkan
  # check, a missing boot file), no game. The staged runtime goes into the Linux package job.
  gpu-tests:
    name: Game runtime and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDL3_VERSION: release-3.2.0
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang cmake ninja-build pkg-config glslang-tools nasm \
            zlib1g-dev libopus-dev libvulkan-dev libfmt-dev libboost-dev libxxhash-dev mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgles-dev libdrm-dev \
            libgbm-dev libpulse-dev libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev
          # mesa-vulkan-drivers: lavapipe, a software Vulkan device (async-pipeline-cache-test, gow3-probe --vulkan-only)
          # names that differ between Ubuntu releases: each one on its own, so a missing one is named
          for p in libvulkan-memory-allocator-dev libvma-dev robin-map-dev libtsl-robin-map-dev libzydis-dev; do
            sudo apt-get install -y -q --no-install-recommends "$p" > /dev/null 2>&1 && echo "installed $p" ||
              echo "::warning::no package $p"
          done

      - name: Reuse SDL3
        id: sdl3
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL3_VERSION }}-ubuntu-24.04-desktop

      - name: SDL3
        if: steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b "$SDL3_VERSION" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl"
          cmake -S "$RUNNER_TEMP/sdl" -B "$RUNNER_TEMP/sdl/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF > "$RUNNER_TEMP/sdl.log"
          grep -E 'SDL_(X11|WAYLAND|PULSEAUDIO|PIPEWIRE|ALSA|HIDAPI)\b' "$RUNNER_TEMP/sdl/build/CMakeCache.txt" || true
          cmake --build "$RUNNER_TEMP/sdl/build"
          cmake --install "$RUNNER_TEMP/sdl/build"

      - name: Reuse the small FFmpeg
        uses: actions/cache@v4
        with:
          path: downloads/ffmpeg-8.1.1-min-linux
          key: ffmpeg-min-linux-${{ hashFiles('tools/build_ffmpeg.sh') }}-ubuntu-24.04

      - name: Small FFmpeg
        run: CC=clang bash tools/build_ffmpeg.sh

      - name: Build the runtime
        run: |
          export PKG_CONFIG_PATH="$HOME/sdl3/lib/pkgconfig:$HOME/sdl3/lib64/pkgconfig:$PWD/downloads/ffmpeg-8.1.1-min-linux/lib/pkgconfig"
          if ! CC=clang CXX=clang++ bash gow3_pc/build.sh > build.log 2>&1; then
            cat build.log
            grep -E 'error|undefined reference|CMake Error' gow3_pc/out/gpu-build.log build.log 2>/dev/null | head -20 |
              while IFS= read -r l; do echo "::error::$(cut -c1-900 <<< "$l")"; done
            exit 1
          fi
          cat build.log
          grep -c 'warning:' gow3_pc/out/gpu-build.log | xargs echo "compiler warnings:"
          ls -l gow3_pc/out

      - name: Start the runtime (no game)
        run: |
          probe=gow3_pc/out/gow3-probe
          echo "libraries:"; ldd "$probe"
          echo "exports uncharted_u3_voice: $(nm -D --defined-only "$probe" | grep -c ' uncharted_u3_voice$')"
          nm -D --defined-only "$probe" | grep -q ' uncharted_u3_voice$'
          status=0; "$probe" > usage.log 2>&1 || status=$?
          cat usage.log
          [[ $status == 1 ]] && grep -q '^Usage: ' usage.log || { echo "::error title=gow3-probe::usage check failed ($status)"; exit 1; }
          status=0; "$probe" /nonexistent/boot.bin > missing.log 2>&1 || status=$?
          cat missing.log
          [[ $status == 1 ]] && grep -q 'cannot open boot file' missing.log || { echo "::error title=gow3-probe::missing boot file check failed ($status)"; exit 1; }
          "$probe" --vulkan-only | tee vulkan.log
          grep -q 'readback PASS' vulkan.log || { echo "::error title=gow3-probe::Vulkan check failed"; exit 1; }

      - name: Unit tests
        run: bash gow3_pc/tests/run_unit_tests.sh gow3_pc/out/gpu

      - name: Stage the runtime for the package
        run: |
          export PKG_CONFIG_PATH="$HOME/sdl3/lib/pkgconfig:$HOME/sdl3/lib64/pkgconfig"
          CC=clang CXX=clang++ bash tools/package_linux.sh runtime
          ls -l dist/runtime/gow3_pc/out; find dist/runtime/licenses | sort

      - name: Keep the runtime
        uses: actions/upload-artifact@v4
        with:
          name: runtime-linux
          path: dist/runtime
